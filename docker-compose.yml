services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/vendor
      - /app/node_modules
    command: >
      sh -c "
        composer install &&
        npm install &&
        npm run build &&
        php artisan storage:link &&
        php artisan migrate --force || true &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
